[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lassejlv/diths"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
dith-core = { path = "crates/dith-core" }
flate2 = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
js-sys = "0.3.107"
png = "0.18"
rayon = "1"
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
wasm-bindgen = "0.2.130"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# dith-wasm: `crates/dith-wasm/scripts/build.sh` builds with this profile. opt-level "s" and "z"
# save 8% brotli but dither up to 3.5x slower, so speed wins.
[profile.wasm-release]
inherits = "release"
opt-level = 3
# Keep the target_features section for wasm-bindgen; wasm-opt strips names and producers.
strip = false
