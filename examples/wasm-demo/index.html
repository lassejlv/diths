<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dith-wasm demo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: rgb(0 0 0 / 1);
    --muted: rgb(0 0 0 / 0.56);
    --border: rgb(0 0 0 / 0.1);
    --fill: rgb(0 0 0 / 0.04);
    --hover: rgb(0 0 0 / 0.06);
    --primary: #171717;
    --on-primary: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --text: rgb(255 255 255 / 1);
      --muted: rgb(255 255 255 / 0.54);
      --border: rgb(255 255 255 / 0.14);
      --fill: rgb(255 255 255 / 0.05);
      --hover: rgb(255 255 255 / 0.08);
      --primary: #f5f5f5;
      --on-primary: #0a0a0a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 16px; }
  .controls > * {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--fill);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  .controls > *:hover { background: var(--hover); }
  .controls label { display: inline-flex; align-items: center; }
  .controls input[type="file"] { display: none; }
  .controls select { min-width: 200px; }
  .controls #download {
    margin-left: auto;
    border-color: transparent;
    background: var(--primary);
    color: var(--on-primary);
  }
  .controls #download:hover { background: var(--primary); opacity: 0.9; }
  .controls #download:disabled { opacity: 0.4; cursor: default; }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: var(--fill);
    image-rendering: pixelated;
  }
  #status { margin-top: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>dith in the browser</h1>
  <p>Pick an image and a preset. Everything runs locally in WebAssembly.</p>
  <div class="controls">
    <label>Choose image<input id="file" type="file" accept="image/*"></label>
    <select id="preset" aria-label="Preset"></select>
    <button id="download" type="button" disabled>Download PNG</button>
  </div>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <p id="status">Loading…</p>
</main>
<script type="module">
  // Serve the repository root (for example `python3 -m http.server`) and open /examples/wasm-demo/
  // after building the package with crates/dith-wasm/scripts/build.sh.
  import init, { dither, encode, presets } from "../../crates/dith-wasm/pkg/web/dith_wasm.js";

  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let source = null;
  let result = null;

  await init();
  for (const p of presets()) $("preset").add(new Option(p.name, p.id));
  $("preset").value = new URLSearchParams(location.search).get("preset") ?? "risograph";

  async function load(blob) {
    const bitmap = await createImageBitmap(blob);
    const scratch = new OffscreenCanvas(bitmap.width, bitmap.height).getContext("2d");
    scratch.drawImage(bitmap, 0, 0);
    source = scratch.getImageData(0, 0, bitmap.width, bitmap.height);
    render();
  }

  function render() {
    if (!source) return;
    const started = performance.now();
    try {
      result = dither(source.data, source.width, source.height, $("preset").value);
    } catch (err) {
      $("status").textContent = `${err.code}: ${err.message}`;
      return;
    }
    const ms = performance.now() - started;
    canvas.width = result.width;
    canvas.height = result.height;
    ctx.putImageData(new ImageData(result.rgba, result.width, result.height), 0, 0);
    $("download").disabled = false;
    $("status").textContent = `${result.width} × ${result.height} · ${result.palette.length} colors · ${ms.toFixed(0)} ms`;
    document.body.dataset.rendered = $("preset").value;
  }

  $("file").addEventListener("change", (e) => e.target.files[0] && load(e.target.files[0]));
  $("preset").addEventListener("change", render);
  $("download").addEventListener("click", () => {
    const png = encode(result.rgba, result.width, result.height, "png");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([png], { type: "image/png" }));
    a.download = `dith-${$("preset").value}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  load(await (await fetch("../../assets/intro-poster.jpg")).blob());
</script>
</body>
</html>
