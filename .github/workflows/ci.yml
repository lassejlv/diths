name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  glibc-floor:
    name: glibc floor (x86_64 release)
    runs-on: ubuntu-24.04
    env:
      # Highest glibc symbol version the release binary may import. Keep in sync with release.yml.
      GLIBC_MAX: "2.39"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check glibc symbol floor
        shell: bash
        run: |
          set -euo pipefail
          bin="target/release/dith"
          objdump -T "$bin" \
            | awk '{ for (i = 1; i < NF; i++) if ($i ~ /^\(?GLIBC_[0-9.]+\)?$/) { v = $i; gsub(/[()]|GLIBC_/, "", v); print v, $NF } }' \
            | sort -u > glibc-syms.txt
          bad=0
          while read -r ver sym; do
            if [ "$(printf '%s\n%s\n' "$ver" "$GLIBC_MAX" | sort -V | tail -n1)" != "$GLIBC_MAX" ]; then
              echo "::error::$sym needs GLIBC_$ver (ceiling is GLIBC_$GLIBC_MAX)"
              bad=1
            fi
          done < glibc-syms.txt
          rm -f glibc-syms.txt
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK: $bin needs nothing newer than GLIBC_$GLIBC_MAX"

  wasm:
    name: WebAssembly (dith-wasm)
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: "133"
      # Raw .wasm size budget for the default build, about 10% above the measured 826 KB.
      WASM_SIZE_BUDGET: "910000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Clippy (wasm32)
        run: cargo clippy --locked -p dith-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

      - name: Build default package
        run: crates/dith-wasm/scripts/build.sh

      - name: Check size budget
        run: |
          size=$(wc -c < crates/dith-wasm/pkg/web/dith_wasm_bg.wasm)
          echo "default dith_wasm_bg.wasm: $size bytes (budget $WASM_SIZE_BUDGET)"
          if [ "$size" -gt "$WASM_SIZE_BUDGET" ]; then
            echo "::error::dith_wasm_bg.wasm is $size bytes, over the $WASM_SIZE_BUDGET budget"
            exit 1
          fi

      - name: Parity with native (default)
        run: node crates/dith-wasm/scripts/parity.mjs crates/dith-wasm/pkg/node

      - name: Build and check parity (full)
        run: |
          crates/dith-wasm/scripts/build.sh --features full --out "$RUNNER_TEMP/pkg-full"
          node crates/dith-wasm/scripts/parity.mjs "$RUNNER_TEMP/pkg-full/node" full
